name = "mihir-ai-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
VERSION = "0.1.0"
ENV = "dev"

# Cloudflare D1 binding
# Replace database_id with your actual ID from: npx wrangler d1 list
[[d1_databases]]
binding = "DB"
database_name = "mihir_ai"
database_id = "06c57d13-f79e-4d3a-b7df-54b7ef9e7aa1"

# Cloudflare Workers AI binding
[ai]
binding = "AI"

# Cloudflare KV binding — used for rate limiting
# ⚠️  BEFORE DEPLOYING: replace the id below with your real namespace ID.
#    Find it at: Cloudflare Dashboard → Workers & Pages → KV
#    Or run:     npx wrangler kv namespace list
#    The binding works locally with any placeholder (Wrangler creates a local store).
[[kv_namespaces]]
binding = "RL"
id = "41eeb5b2cf4f459fbf8e36c9be09863c"

# Secrets to bind at runtime (set via `wrangler secret put`):
#   RESEND_API_KEY
#   TURNSTILE_SECRET_KEY
#   SESSION_HMAC_KEY
#   IP_HASH_SALT
