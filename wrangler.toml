name = "mihir-ai-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
VERSION = "0.1.0"
ENV = "dev"

# Cloudflare D1 binding
# Replace database_id with your actual ID from: npx wrangler d1 list
[[d1_databases]]
binding = "DB"
database_name = "mihir_ai"
database_id = "06c57d13-f79e-4d3a-b7df-54b7ef9e7aa1"

# Cloudflare KV binding (activate when KV namespace is ready)
# [[kv_namespaces]]
# binding = "KV"
# id = "YOUR_KV_NAMESPACE_ID"

# Secrets to bind at runtime (set via `wrangler secret put`):
#   RESEND_API_KEY
#   TURNSTILE_SECRET_KEY
#   SESSION_HMAC_KEY
#   IP_HASH_SALT
